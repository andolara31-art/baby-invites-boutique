<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Baby Invites Boutique — Editorial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Outfit:wght@200;300;400;500;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: #1a1410;
  color: #2a201a;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  height: 100%; width: 100%;
}
#root { width: 100%; height: 100%; }

/* ── Stage ── */
.boutique-stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.boutique-stage::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(212,165,116,0.06) 0%, transparent 1px),
    radial-gradient(circle at 60% 70%, rgba(212,165,116,0.04) 0%, transparent 1px),
    radial-gradient(circle at 80% 20%, rgba(212,165,116,0.05) 0%, transparent 1px);
  background-size: 5px 5px, 9px 9px, 13px 13px;
  pointer-events: none; opacity: 0.7; z-index: 0;
}

/* ── Desktop 2-column ── */
@media (min-width: 900px) {
  .boutique-stage {
    display: grid;
    grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
    gap: 0;
    align-items: stretch;
    justify-items: stretch;
  }
  .stage-left {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 16px;
    padding: 32px clamp(22px, 3vw, 36px);
    min-height: 100dvh;
    max-width: none;
    width: 100%;
    background: rgba(10,6,4,0.1);
    border-right: 1px solid rgba(245,233,216,0.08);
    overflow-y: auto;
    scrollbar-width: none;
    z-index: 10;
  }
  .stage-left::-webkit-scrollbar { display: none; }
  .brand-mark, .reel-meta, .outside-controls { display: none !important; }
  .phone { margin: 0; }
}
@media (max-width: 899px) {
  .stage-left { display: none !important; }
}

/* ── Desktop left panel ── */
.stage-left { display: none; }
.stage-left-eyebrow {
  font-family: 'Outfit', sans-serif;
  font-size: 10px; letter-spacing: 0.36em;
  text-transform: uppercase; font-weight: 500;
  color: rgba(245,233,216,0.5); margin-bottom: 16px;
}
.stage-left-brand {
  font-family: 'DM Serif Display', serif;
  font-size: 18px; color: #f5e9d8; line-height: 1; margin-bottom: 4px;
}
.stage-left-sub {
  font-family: 'Outfit', sans-serif;
  font-size: 9px; letter-spacing: 0.36em;
  text-transform: uppercase; opacity: 0.45; color: #f5e9d8;
}
.stage-left-headline {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(22px, 2.1vw, 28px);
  color: #f5e9d8; line-height: 1.05;
  letter-spacing: -0.02em; margin-bottom: 12px;
}
.stage-left-desc {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 14px;
  color: rgba(245,233,216,0.75); line-height: 1.5;
  margin-bottom: 0;
}
.stage-left-divider {
  width: 40px; height: 1px;
  background: rgba(212,165,116,0.4);
}
.stage-left-scenes {
  display: flex; flex-direction: column; gap: 5px;
  opacity: 0.72;
}
.stage-left-scene-btn {
  background: none; border: none; cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(245,233,216,0.4); text-align: left;
  padding: 3px 0; transition: color 0.2s ease;
}
.stage-left-scene-btn.active { color: #d4a574; }
.stage-left-scene-btn:hover { color: rgba(245,233,216,0.7); }

/* ── Phone ── */
.phone {
  position: relative;
  width: 390px;
  height: min(844px, 94vh);
  background: #fff;
  border-radius: 54px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.8) inset,
    0 40px 100px -20px rgba(0,0,0,0.65),
    0 80px 140px -40px rgba(0,0,0,0.5),
    0 0 0 11px #0a0604,
    0 0 0 12px rgba(255,255,255,0.04);
  overflow: hidden;
  z-index: 2;
  flex-shrink: 0;
}
.phone-notch {
  position: absolute; top: 12px; left: 50%;
  transform: translateX(-50%);
  width: 118px; height: 34px;
  background: #0a0604; border-radius: 22px; z-index: 50;
  pointer-events: none;
}
.phone-scroll {
  width: 100%; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
  scroll-behavior: smooth;
}
.phone-scroll::-webkit-scrollbar { display: none; }

/* ── Scenes ── */
.scene {
  width: 100%;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.scene-snap {
  height: 100%;
  flex-shrink: 0;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
}

/* Safe zone — below notch */
.safe-top { padding-top: 60px; }

/* ── Status bar ── */
.statusbar {
  position: absolute; top: 16px; left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 10px 32px 0;
  font-size: 13px; font-weight: 600;
  z-index: 40; font-feature-settings: "tnum";
  mix-blend-mode: difference; color: #faf3e7;
  pointer-events: none;
}
.statusbar .right { display: flex; gap: 5px; align-items: center; }

/* ── Type ── */
.eyebrow {
  font-family: 'Outfit', sans-serif;
  font-size: 10px; letter-spacing: 0.32em;
  text-transform: uppercase; font-weight: 500;
}
.display { font-family: 'DM Serif Display', serif; font-weight: 400; letter-spacing: -0.02em; line-height: 1.0; }
.script  { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }

/* ── Animations ── */
@keyframes float-1 { 0%,100%{transform:translate(0,0) rotate(-9deg);} 50%{transform:translate(2px,-10px) rotate(-7deg);} }
@keyframes float-2 { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-12px) rotate(1deg);} }
@keyframes float-3 { 0%,100%{transform:translate(0,0) rotate(10deg);} 50%{transform:translate(3px,-10px) rotate(8deg);} }
@keyframes drift   { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
@keyframes drift-slow { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
@keyframes fall {
  0%  { transform:translateY(-20px) rotate(0); opacity:0; }
  8%, 90% { opacity:1; }
  100%{ transform:translateY(120vh) rotate(360deg); opacity:0; }
}
@keyframes wave { 0%,100%{height:3px;} 50%{height:12px;} }
@keyframes pulse-down { 0%,100%{transform:translateX(-50%) translateY(0);opacity:0.4;} 50%{transform:translateX(-50%) translateY(5px);opacity:0.8;} }

/* ── Invite mocks ── */
.invite-mock {
  position: relative; border-radius: 18px; overflow: hidden;
  box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 14px 36px -10px rgba(0,0,0,0.3), 0 32px 64px -20px rgba(0,0,0,0.2);
  aspect-ratio: 9/16; width: 100%;
}
.invite-honey  { background: radial-gradient(ellipse at 50% 30%, #fff4dd 0%, #f5e1bd 60%, #e8c989 100%); }
.invite-floral { background: radial-gradient(ellipse at 50% 70%, #fde4e0 0%, #f5cfc9 50%, #e8b4b0 100%); }
.invite-minimal{ background: linear-gradient(180deg, #faf5ec 0%, #f0e6d4 100%); }
.invite-celestial{ background: radial-gradient(ellipse at 50% 18%, #52617e 0%, #273047 55%, #111827 100%); }
.invite-safari{ background: radial-gradient(ellipse at 50% 30%, #fbf0df 0%, #e4d1ad 58%, #c7b084 100%); }
.invite-coquette{ background: radial-gradient(ellipse at 50% 30%, #fff5f8 0%, #f4d9ee 54%, #d8b7ec 100%); }
.watercolor { position:absolute; border-radius:50%; filter:blur(18px); opacity:0.42; pointer-events:none; }
.wave-bar { width:2px; background:currentColor; border-radius:2px; animation:wave 0.9s ease-in-out infinite; }

/* ── Buttons ── */
.btn-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 15px 22px; border-radius: 100px;
  font-family: 'Outfit', sans-serif; font-weight: 500;
  font-size: 12px; letter-spacing: 0.06em;
  border: none; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; text-transform: uppercase;
}
.btn-pill:active { transform: scale(0.97); }
.btn-dark      { background: #1a1410; color: #f5e9d8; }
.btn-light     { background: #f5e9d8; color: #1a1410; border: 1px solid rgba(0,0,0,0.06); }
.btn-whatsapp  { background: #25D366; color: #fff; box-shadow: 0 10px 28px -6px rgba(37,211,102,0.5); }

/* ── Backgrounds ── */
.bg-honey-deep {
  background: radial-gradient(ellipse at 30% 25%, #fff4dd 0%, transparent 50%),
              radial-gradient(ellipse at 80% 90%, #d4a574 0%, transparent 50%),
              linear-gradient(180deg, #f5e1bd 0%, #d4a574 100%);
}
.bg-floral-deep {
  background: radial-gradient(ellipse at 70% 20%, #fff0eb 0%, transparent 55%),
              radial-gradient(ellipse at 20% 90%, #c87a76 0%, transparent 55%),
              linear-gradient(180deg, #fde4e0 0%, #e8b4b0 100%);
}
.bg-minimal-deep {
  background: radial-gradient(ellipse at 50% 30%, #faf6f0 0%, transparent 55%),
              radial-gradient(ellipse at 80% 100%, #c9a876 0%, transparent 50%),
              linear-gradient(180deg, #f0e6d4 0%, #c9a876 100%);
}
.bg-paper { background: radial-gradient(ellipse at 50% 0%, #fdf6e8 0%, #ead8c4 100%); }
.bg-night { background: radial-gradient(ellipse at 50% 30%, #2a1f18 0%, #0e0a08 100%); color: #f5e9d8; }

/* ── Demo phone-in-phone ── */
.demo-frame {
  border-radius: 32px; background: #0a0604; padding: 8px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 20px 44px -10px rgba(0,0,0,0.55);
}
.demo-screen { width: 100%; height: 100%; border-radius: 25px; overflow: hidden; position: relative; }
.demo-grid {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(260px, 0.82fr) minmax(300px, 1fr);
  grid-template-rows: auto 1fr;
  gap: clamp(28px, 5vw, 72px);
  align-items: center;
  padding: 54px clamp(30px, 5vw, 72px) 44px;
  min-height: 0;
}
.demo-copy {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 520px;
  z-index: 3;
}
.demo-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-tab {
  appearance: none;
  border-radius: 999px;
  border: 1px solid rgba(245,233,216,0.18);
  background: rgba(245,233,216,0.04);
  color: rgba(245,233,216,0.7);
  cursor: pointer;
  font: 500 11px/1 'Outfit', sans-serif;
  letter-spacing: 0.08em;
  padding: 9px 13px;
  text-transform: uppercase;
  transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
}
.demo-tab:hover { transform: translateY(-1px); color: #f5e9d8; border-color: rgba(245,233,216,0.34); }
.demo-tab.active { background: #f5e9d8; color: #1a1410; border-color: #f5e9d8; }
.demo-personalizer {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 2px;
}
.demo-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.demo-field:first-child {
  grid-column: 1 / -1;
}
.demo-field {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px 11px;
  border-radius: 14px;
  border: 1px solid rgba(245,233,216,0.13);
  background: rgba(245,233,216,0.055);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
  transition: border-color .25s ease, background .25s ease, transform .25s ease, box-shadow .25s ease;
}
.demo-field:focus-within {
  transform: translateY(-1px);
  border-color: rgba(212,165,116,0.5);
  background: rgba(245,233,216,0.095);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 12px 30px -26px rgba(212,165,116,0.65);
}
.demo-field label {
  font-family: 'Outfit', sans-serif;
  font-size: 7px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: rgba(212,165,116,0.78);
  font-weight: 600;
}
.demo-field input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: #f5e9d8;
  font: 500 13px/1.2 'Outfit', sans-serif;
  letter-spacing: 0;
}
.demo-field input::placeholder {
  color: rgba(245,233,216,0.38);
}
.demo-field input[type="date"] {
  color-scheme: dark;
}
.demo-field input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1) sepia(.24) saturate(1.6) hue-rotate(350deg);
  opacity: .7;
}
.demo-live-note {
  margin: 0;
  color: rgba(245,233,216,0.6);
  font-size: 12px;
  line-height: 1.45;
}
.demo-device-stack {
  width: min(38vw, 390px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.demo-device-stack .demo-device {
  width: 100%;
}
.demo-device-caption {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  color: rgba(245,233,216,0.72);
  font-size: 15px;
  line-height: 1.2;
}
.demo-live-cta {
  width: 100%;
  justify-content: center;
  padding: 14px 20px;
  font-size: 11px;
  box-shadow: 0 18px 40px -22px rgba(245,233,216,0.5);
}
.demo-link-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.demo-share-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid rgba(212,165,116,0.22);
  background: rgba(245,233,216,0.075);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.demo-share-panel label {
  font-family: 'Outfit', sans-serif;
  font-size: 7px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: rgba(212,165,116,0.82);
  font-weight: 600;
}
.demo-share-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 8px;
}
.demo-share-row input {
  min-width: 0;
  border: 1px solid rgba(245,233,216,0.14);
  border-radius: 999px;
  background: rgba(0,0,0,0.16);
  color: rgba(245,233,216,0.86);
  font: 500 11px/1.2 'Outfit', sans-serif;
  padding: 11px 14px;
  outline: 0;
}
.demo-share-row button,
.demo-link-actions button {
  appearance: none;
  border: 1px solid rgba(245,233,216,0.18);
  border-radius: 999px;
  background: rgba(245,233,216,0.08);
  color: #f5e9d8;
  font: 600 10px/1 'Outfit', sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 11px 14px;
  cursor: pointer;
}
.demo-link-actions button:first-child {
  background: #f5e9d8;
  color: #1a1410;
  border-color: #f5e9d8;
}
.demo-benefits {
  grid-column: 1;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 14px;
  align-self: start;
  margin-top: -42px;
}
.demo-benefit {
  display: flex;
  align-items: center;
  gap: 9px;
  color: rgba(245,233,216,0.72);
  font-size: 12px;
}
.demo-benefit i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #d4a574;
  box-shadow: 0 0 0 5px rgba(212,165,116,0.08);
  flex-shrink: 0;
}
.style-catalog-scene.scene-snap {
  height: auto;
  min-height: 100dvh;
}
.style-catalog-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 72px clamp(28px, 5vw, 64px) 42px;
  gap: 22px;
  position: relative;
  z-index: 2;
}
.style-catalog-head {
  max-width: 720px;
}
.style-catalog-head p {
  font-size: 14px;
  color: #5a4838;
  margin-top: 12px;
  line-height: 1.55;
  max-width: 520px;
}
.style-catalog-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: stretch;
}
.style-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  padding: 12px;
  border: 1px solid rgba(122,79,31,0.12);
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.54), rgba(255,255,255,0.22)),
    var(--card-bg, #fff6f0);
  box-shadow: 0 24px 50px -34px rgba(62,36,22,0.42), inset 0 1px 0 rgba(255,255,255,0.6);
  overflow: hidden;
}
.style-card::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .2;
  background-image: radial-gradient(circle at 1px 1px, var(--card-accent, #8a4f4f) 1px, transparent 0);
  background-size: 18px 18px;
  pointer-events: none;
}
.style-card-preview {
  position: relative;
  z-index: 1;
  width: min(100%, 150px);
  margin: 0 auto;
  filter: drop-shadow(0 22px 28px rgba(75,39,37,.18));
  animation: drift-slow 5.4s ease-in-out infinite;
}
.style-card-body {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.style-card-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.style-card-name {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(20px, 2.2vw, 28px);
  line-height: .95;
  letter-spacing: 0;
  color: var(--card-ink, #2a201a);
}
.style-card-phrase {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.25;
  color: var(--card-accent, #8a4f4f);
}
.style-card-desc {
  font-size: 11px;
  line-height: 1.45;
  color: rgba(42,32,26,.72);
}
.style-card-price {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  padding: 7px 9px;
  border-radius: 999px;
  background: rgba(255,255,255,.64);
  color: var(--card-ink, #2a201a);
  font-size: 10px;
  white-space: nowrap;
  border: 1px solid rgba(0,0,0,.05);
}
.style-card-price strong {
  font-family: 'DM Serif Display', serif;
  font-size: 19px;
  line-height: 1;
}
.style-card-swatches {
  display: flex;
  gap: 5px;
}
.style-card-swatch {
  appearance: none;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,.1);
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.style-card-swatch:hover {
  transform: translateY(-1px);
}
.style-card-swatch.active {
  border-color: var(--card-ink, #2a201a);
  box-shadow: 0 0 0 3px rgba(255,255,255,.72), 0 0 0 5px color-mix(in srgb, var(--active-color) 34%, transparent);
  transform: scale(1.06);
}
.style-card-preview-shell {
  position: relative;
  border-radius: 20px;
}
.style-card-preview-shell::before {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 24px;
  background:
    radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--active-color, #e8b4b0) 34%, transparent), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--active-color, #e8b4b0) 14%, transparent), transparent);
  opacity: .75;
  filter: blur(2px);
  transition: background .28s ease, opacity .28s ease;
}
.style-card-preview-shell .invite-mock {
  position: relative;
  z-index: 1;
  box-shadow:
    0 1px 0 rgba(255,255,255,.55) inset,
    0 18px 32px -20px color-mix(in srgb, var(--active-color, #8a4f4f) 52%, #000);
}
.style-card-preview-shell .invite-mock::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--active-color, #e8b4b0) 18%, transparent), transparent 58%);
  mix-blend-mode: soft-light;
  opacity: .9;
  pointer-events: none;
}
.palette-preview {
  width: 100%;
}
.palette-preview .invite-mock {
  background:
    radial-gradient(circle at 18% 12%, color-mix(in srgb, var(--invite-soft) 42%, transparent), transparent 28%),
    radial-gradient(circle at 86% 84%, color-mix(in srgb, var(--invite-accent) 32%, transparent), transparent 31%),
    linear-gradient(160deg, var(--invite-bg), var(--invite-secondary)) !important;
  color: var(--invite-text);
}

}
.xp-title {

}

}
.xp-detail-label {

.xp-detail-value {

}
.xp-map-card {

}

}

}

  position: absolute;

.xp-button-row {
  display: flex;
  flex-direction: column;
  gap: 9px;
  width: 100%;
  margin-top: 18px;
}
.xp-btn {

  border: 0;

}
.xp-btn-primary {

}
.xp-btn-secondary {
  background: rgba(255,255,255,.55);

  border: 1px solid color-mix(in srgb, var(--xp-soft) 36%, transparent);
}
.xp-indicators {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 15px;
  z-index: 9;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}
.xp-dot {
  appearance: none;
  border: 0;
  padding: 0;
  height: 18px;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 4px;
  color: color-mix(in srgb, var(--xp-ink) 55%, transparent);

  letter-spacing: .05em;
  text-align: center;
}
.xp-dot i {
  height: 3px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--xp-ink) 18%, transparent);
  overflow: hidden;
  position: relative;
}
.xp-dot.active i { background: color-mix(in srgb, var(--xp-ink) 28%, transparent); }
.xp-dot.active i::after {
  content: '';
  position: absolute;
  inset: 0;
  transform-origin: left center;
  background: var(--xp-accent);
  animation: xp-progress 3s linear forwards;
}
.live-value {
  display: inline-block;
  transition: opacity .15s ease, transform .15s ease;
}
.live-value.is-out {
  opacity: 0;
  transform: translateY(-6px);
}
.live-value.is-in {
  animation: live-value-in .25s cubic-bezier(.35,.8,.25,1) both;
}
.xp-deco { position: absolute; pointer-events: none; z-index: 1; }
.xp-honey-drop {
  width: 9px; height: 13px; border-radius: 70% 70% 70% 18%;

  opacity: .45;

}
.xp-petal {
  width: 12px; height: 7px; border-radius: 50%;
  background: var(--xp-soft);
  opacity: .42;
  animation: xp-petal 7s linear infinite;
}
.xp-star {
  color: var(--xp-soft);
  opacity: .52;
  animation: xp-shimmer 2.7s ease-in-out infinite;
}
@keyframes xp-reveal { to { opacity: 1; transform: translateY(0); } }
@keyframes xp-scale { to { opacity: 1; transform: scale(1); } }
@keyframes xp-float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-7px); } }
@keyframes xp-wave { 0%,100%{ height: 3px; } 50%{ height: 10px; } }
@keyframes xp-route { to { stroke-dashoffset: 0; } }
@keyframes xp-pin { to { opacity: 1; transform: rotate(-45deg) scale(1); } }
@keyframes xp-pulse { 0%,100%{ box-shadow: 0 10px 28px -16px var(--xp-ink), 0 0 0 0 color-mix(in srgb, var(--xp-accent) 22%, transparent); } 50%{ box-shadow: 0 10px 28px -16px var(--xp-ink), 0 0 0 8px color-mix(in srgb, var(--xp-accent) 0%, transparent); } }
@keyframes xp-progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes xp-drop { 0%,100%{ transform: translateY(0) scale(1); opacity:.34; } 50%{ transform: translateY(10px) scale(.96); opacity:.55; } }
@keyframes xp-petal { 0%{ transform: translateY(-14px) translateX(0) rotate(0deg); opacity:0; } 15%,80%{ opacity:.42; } 100%{ transform: translateY(110px) translateX(-22px) rotate(80deg); opacity:0; } }
@keyframes xp-shimmer { 0%,100%{ opacity:.32; transform: scale(.92); } 50%{ opacity:.72; transform: scale(1.04); } }
@keyframes xp-cloud { 0%,100%{ transform: translateX(0); opacity:.28; } 50%{ transform: translateX(10px); opacity:.42; } }
@keyframes xp-leaf { 0%,100%{ transform: translateY(0) rotate(var(--r, 0deg)); } 50%{ transform: translateY(-7px) rotate(calc(var(--r, 0deg) + 5deg)); } }
@keyframes xp-butterfly { 0%,100%{ transform: translate(0,0) rotate(-6deg); opacity:.34; } 50%{ transform: translate(8px,-10px) rotate(7deg); opacity:.62; } }
@keyframes live-value-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

function formatInviteDate(value) {
  if (!value) value = LIVE_DEFAULTS.dateInput;
  const [year, month, day] = value.split('-');
  if (!year || !month || !day) return LIVE_DEFAULTS.date;
  return `${day} · ${month} · ${year}`;
}

function getLiveInviteData(collection, fields) {
  const style = CDATA[collection] ? collection : 'floral';
  const base = CDATA[style];
  const baby = fields.baby?.trim() || LIVE_DEFAULTS.baby;
  const dateInput = fields.date || LIVE_DEFAULTS.dateInput;
  const date = formatInviteDate(fields.date);
  const time = fields.time || LIVE_DEFAULTS.time;
  const place = fields.place?.trim() || LIVE_DEFAULTS.place;
  const address = fields.address?.trim() || LIVE_DEFAULTS.address;
  const whatsapp = fields.whatsapp?.trim() || LIVE_DEFAULTS.whatsapp;
  return {
    ...base,
    style,
    baby,
    dateInput,
    date,
    time,
    place,
    address,
    city: address,
    whatsapp,
  };
}

function cleanText(value, fallback = '', max = 80) {
  const text = String(value ?? '').replace(/[\u0000-\u001F\u007F<>]/g, '').trim();
  return (text || fallback).slice(0, max);
}

function normalizePhone(value) {
  return String(value ?? '').replace(/\D/g, '').slice(0, 18);
}

function sanitizeInvitePayload(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const style = CDATA[raw.style] ? raw.style : 'floral';
  const dateInput = /^\d{4}-\d{2}-\d{2}$/.test(String(raw.dateInput || '')) ? raw.dateInput : LIVE_DEFAULTS.dateInput;
  const time = /^\d{2}:\d{2}$/.test(String(raw.time || '')) ? raw.time : LIVE_DEFAULTS.time;
  return {
    style,
    baby: cleanText(raw.baby, LIVE_DEFAULTS.baby, 48),
    dateInput,
    date: formatInviteDate(dateInput),
    time,
    place: cleanText(raw.place, LIVE_DEFAULTS.place, 80),
    address: cleanText(raw.address, LIVE_DEFAULTS.address, 120),
    whatsapp: normalizePhone(raw.whatsapp),
  };
}

function makeInviteDataFromPayload(payload) {
  const safe = sanitizeInvitePayload(payload);
  if (!safe) return null;
  const base = CDATA[safe.style];
  return { ...base, ...safe, city: safe.address };
}

function encodeInvitePayload(payload) {
  const json = JSON.stringify(sanitizeInvitePayload(payload));
  const binary = unescape(encodeURIComponent(json));
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}

function decodeInvitePayload(encoded) {
  try {
    if (!encoded || encoded.length > 3000) return null;
    const normalized = encoded.replace(/-/g, '+').replace(/_/g, '/');
    const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
    const json = decodeURIComponent(escape(atob(padded)));
    return sanitizeInvitePayload(JSON.parse(json));
  } catch {
    return null;
  }
}

function makeInvitationUrl(payload) {
  const code = encodeInvitePayload(payload);
  return `${window.location.origin}/invitacion?data=${code}`;
}

function makeWhatsappUrl(data) {
  const phone = normalizePhone(data.whatsapp);
  const text = `Hola, confirmo mi asistencia al baby shower de ${data.baby}`;
  return `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
}

function makeMapsUrl(data) {
  const query = [data.address, data.place].filter(Boolean).join(', ');
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

function makeCalendarUrl(data) {
  const start = `${data.dateInput.replace(/-/g, '')}T${data.time.replace(':', '')}00`;
  const endDate = new Date(`${data.dateInput}T${data.time}:00`);
  if (Number.isFinite(endDate.getTime())) endDate.setHours(endDate.getHours() + 3);
  const end = Number.isFinite(endDate.getTime())
    ? `${endDate.getFullYear()}${String(endDate.getMonth()+1).padStart(2,'0')}${String(endDate.getDate()).padStart(2,'0')}T${String(endDate.getHours()).padStart(2,'0')}${String(endDate.getMinutes()).padStart(2,'0')}00`
    : start;
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: `Baby Shower de ${data.baby}`,
    dates: `${start}/${end}`,
    details: `Baby shower de ${data.baby}. Confirma tu asistencia por WhatsApp.`,
    location: [data.place, data.address].filter(Boolean).join(' - '),
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

function LiveValue({ value, as = 'span', className = '', style }) {
  const Tag = as;
  const initial = String(value ?? '');
  const [shown, setShown] = useState(initial);
  const [phase, setPhase] = useState('');
  const shownRef = useRef(initial);

  useEffect(() => {
    const incoming = String(value ?? '');
    if (incoming === shownRef.current) return;
    setPhase('is-out');
    const swap = setTimeout(() => {
      shownRef.current = incoming;
      setShown(incoming);
      setPhase('is-in');
    }, 150);
    const settle = setTimeout(() => setPhase(''), 420);
    return () => {
      clearTimeout(swap);
      clearTimeout(settle);
    };
  }, [value]);

  return <Tag className={`live-value ${phase} ${className}`.trim()} style={style}>{shown}</Tag>;
}

function InviteDemo({ collection, step, setStep, data: liveData, musicOn = true, palette }) {
  const t = palette
    ? { bg1:palette.bg, bg2:palette.secondary, accent:palette.accent, soft:palette.soft || palette.secondary, ink:palette.text, muted:palette.accent }
    : THEMES[collection];
  const data = liveData || CDATA[collection];
  const next = () => setStep((step + 1) % XP_SCENES.length);
  const scene = XP_SCENES[step];
  const sceneNode = {
    cover: <InviteSceneCover data={data} collection={collection}/>,
    message: <InviteSceneMessage data={data}/>,
    details: <InviteSceneDetails data={data}/>,
    location: <InviteSceneLocation data={data}/>,
    confirm: <InviteSceneConfirm/>,
  }[scene.id];

  return (
    <div
      className={`invite-xp invite-xp-${collection}`}
      onClick={next}
      style={{ '--xp-bg1':t.bg1, '--xp-bg2':t.bg2, '--xp-accent':t.accent, '--xp-soft':t.soft, '--xp-ink':t.ink, '--xp-muted':t.muted }}
      role="button"
      tabIndex="0"
      aria-label="Avanzar demo de invitación"
      onKeyDown={(e)=>{ if (e.key === 'Enter' || e.key === ' ') next(); }}
    >
      <InviteDecor collection={collection}/>
      <div className="xp-status">
        <span>{data.name}</span>
        <span className="xp-music">
          <span className="xp-wave">{[0,.2,.4].map((d,i)=><span key={i} style={{ animationDelay:`${d}s` }}/>)}</span>
          {musicOn ? 'Música suave activada' : 'Música pausada'}
        </span>
      </div>
      {React.cloneElement(sceneNode, { key:`${collection}-${scene.id}` })}
      <div className="xp-indicators">
        {XP_SCENES.map((s,i)=>(
          <button key={s.id} className={`xp-dot ${i===step?'active':''}`} onClick={(e)=>{ e.stopPropagation(); setStep(i); }} title={s.label}>
            <span>{s.label}</span><i/>
          </button>
        ))}
      </div>
    </div>
  );
}

    { icon:'heart', label:'Datos personalizados' },
  ];
  useEffect(()=>{ setStep(0); }, [collection]);
  const setInviteStep = useCallback((next) => {
    setStep(prev => typeof next === 'function' ? next(prev) : next);
    setManualTick(t => t + 1);
  }, []);
  useEffect(()=>{
    const id = setInterval(()=>setStep(s=>(s+1)%XP_SCENES.length), 3000);

function SceneCompare() {
  const [pos, setPos] = useState(50);
  const trackRef = useRef(null);
  const dragging = useRef(false);
  const onMove = (cx) => {
    if (!trackRef.current) return;
    const r = trackRef.current.getBoundingClientRect();
    setPos(Math.max(6, Math.min(94, ((cx - r.left) / r.width) * 100)));
  };
  return (
    <div className="scene scene-snap bg-night">
      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'68px 28px 36px', gap:14, overflow:'hidden' }}>
        {/* Header */}
        <div style={{ flexShrink:0 }}>
          <div className="eyebrow" style={{ color:'#d4a574', marginBottom:6 }}>05 · Antes / Después</div>
          <h2 className="display" style={{ fontSize:'clamp(24px,6.5vw,34px)', color:'#f5e9d8', lineHeight:0.95, letterSpacing:'-0.02em' }}>De una imagen plana a una invitación que se puede sentir.</h2>
          <p style={{ marginTop:8, fontSize:13, color:'rgba(245,233,216,0.65)', lineHeight:1.45, maxWidth:520 }}>
            Envía una experiencia con música, mapa y confirmación en un toque.
          </p>
        </div>

        {/* Labels row */}
        <div style={{ display:'flex', justifyContent:'space-between', flexShrink:0 }}>
          <div style={{ fontSize:9, letterSpacing:'0.3em', textTransform:'uppercase', color:'rgba(245,233,216,0.45)', fontWeight:600 }}>← ANTES</div>
          <div style={{ fontSize:9, letterSpacing:'0.3em', textTransform:'uppercase', color:'#d4a574', fontWeight:600 }}>DESPUÉS →</div>
        </div>

        {/* Compare track */}
        <div ref={trackRef} className="compare-track" style={{ flex:1, minHeight:0, maxHeight:380, cursor:'ew-resize' }}
          onMouseDown={()=>{ dragging.current=true; }}
          onMouseMove={e=>{ if(dragging.current) onMove(e.clientX); }}
          onMouseUp={()=>{ dragging.current=false; }}
          onMouseLeave={()=>{ dragging.current=false; }}
          onTouchStart={()=>{ dragging.current=true; }}
          onTouchMove={e=>onMove(e.touches[0].clientX)}
          onTouchEnd={()=>{ dragging.current=false; }}>

          {/* ANTES base */}
          <div className="compare-side" style={{ background:'#cfc7bd', display:'flex', alignItems:'center', justifyContent:'flex-start', padding:16 }}>
            <BeforeFlatInvite/>

          {/* DESPUÉS overlay desde la derecha */}

}

/* ═══════════════════════════════════════════════════════════════
   DESKTOP LEFT PANEL
═══════════════════════════════════════════════════════════════ */
const SCENE_COPY = {
  hero:      { headline:'Invitaciones digitales\npara baby shower.',                    sub:'Personalizadas, animadas y listas para compartir por WhatsApp desde $10.' },
  demo:      { headline:'Personaliza en vivo\nen segundos.',                           sub:'Escribe nombre, fecha y lugar mientras la invitación se actualiza dentro del teléfono.' },
  steps:     { headline:'Tu invitación\nen 3 pasos.',                                  sub:'Elige diseño, envía tus datos y recibe el link listo para compartir.' },
  collections:{ headline:'Elige el estilo\nque quieres enviar.',                        sub:'Seis colecciones boutique, personalizadas con los datos de tu evento.' },
  compare:   { headline:'Más que una\nimagen plana.',                                  sub:'Una invitación interactiva con música, mapa y confirmación.' },
  includes:  { headline:'Más que una\nimagen.',                                         sub:'Diseño animado, link, WhatsApp, ubicación, calendario y música visual.' },
  price:     { headline:'Desde $10\nlista en 24h.',                                    sub:'Personalización incluida. Solo envías tus datos y hacemos el resto.' },
  cta:       { headline:'¿Quieres una\ninvitación así?',                               sub:'Pídela por WhatsApp y recibe tu experiencia lista en 24h.' },
};

function StageLeft({ activeScene, goTo }) {
  const copy = SCENE_COPY[activeScene] || SCENE_COPY.hero;
  const idx = Math.max(0, SCENES_META.findIndex(s => s.id === activeScene));
  return (
    <div className="stage-left">
      <div>
        <div className="stage-left-brand">Baby Invites</div>
        <div className="stage-left-sub">Digital · Baby Shower</div>
      </div>
      <div style={{ width:32, height:1, background:'rgba(212,165,116,0.3)' }}/>
      <div>
        <div className="stage-left-headline" style={{ whiteSpace:'pre-line' }}>{copy.headline}</div>
        <div className="stage-left-desc">{copy.sub}</div>
      </div>
      <div className="stage-left-divider"/>
      <div className="stage-left-scenes" aria-hidden="true">
        <div className="eyebrow" style={{ fontSize:8, color:'#d4a574' }}>{String(idx+1).padStart(2,'0')} / {SCENES_META.length}</div>
        <div style={{ display:'flex', gap:5, marginTop:6 }}>
          {SCENES_META.map((s,i)=>(
            <span key={s.id} style={{ width:i===idx?18:5, height:4, borderRadius:3, background:i===idx?'#d4a574':'rgba(245,233,216,0.18)', transition:'all 0.2s ease' }}/>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════════════ */
const STAGE_BG = {
  dark:  'radial-gradient(ellipse at 25% 20%, #3a2820 0%, transparent 55%), radial-gradient(ellipse at 80% 75%, #2a1f18 0%, transparent 50%), linear-gradient(180deg, #1a1410 0%, #221814 100%)',
  cream: 'radial-gradient(ellipse at 30% 20%, #f5e9d8 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #ead8c4 0%, transparent 50%), linear-gradient(180deg, #efe4d2 0%, #e6d5be 100%)',
  blush: 'radial-gradient(ellipse at 30% 20%, #fde4e0 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #f5cfc9 0%, transparent 50%), linear-gradient(180deg, #fbe7e2 0%, #e8b4b0 100%)',
};
const SCENES_META = [
  {id:'hero',name:'Inicio'},
  {id:'demo',name:'Demo'},
  {id:'steps',name:'Cómo funciona'},
  {id:'collections',name:'Colecciones'},
  {id:'compare',name:'Antes / Después'},
  {id:'includes',name:'Qué incluye'},
  {id:'price',name:'Precio'},
  {id:'cta',name:'Pídela'},
];

function PublicUnavailable() {
  return (
    <div className="public-invite-page">
      <div className="public-unavailable">
        <div className="eyebrow" style={{ color:'#d4a574', marginBottom:10 }}>Baby Invites</div>
        <h1 className="display">Esta invitación no está disponible.</h1>
        <p>El link puede estar incompleto o haber sido copiado con error.</p>
      </div>
    </div>
  );
}

function PublicInvitationPage() {
  const params = new URLSearchParams(window.location.search);
  const payload = decodeInvitePayload(params.get('data'));
  const data = makeInviteDataFromPayload(payload);
  const [step, setStep] = useState(0);
  const [manualTick, setManualTick] = useState(0);
  const [musicOn, setMusicOn] = useState(true);

  useEffect(()=>{
    if (!data) return;
    const id = setInterval(()=>setStep(s=>(s+1)%XP_SCENES.length), 3000);
    return ()=>clearInterval(id);
  }, [data?.style, manualTick]);

  const setInviteStep = useCallback((next) => {
    setStep(prev => typeof next === 'function' ? next(prev) : next);
    setManualTick(t => t + 1);
  }, []);

  if (!data) return <PublicUnavailable/>;

  return (
    <div className="public-invite-page">
      <div className="public-invite-shell">
        <div className="public-invite-meta">
          <div className="eyebrow">{data.name}</div>
          <h1 className="display">Baby Shower de {data.baby}</h1>
          <p>{data.date} · {data.time} · {data.place}</p>
        </div>

        <div className="public-invite-frame">
          <div className="demo-screen">
            <InviteDemo collection={data.style} step={step} setStep={setInviteStep} data={data} musicOn={musicOn}/>
          </div>
        </div>

        <div className="public-actions">
          <button className="public-action primary" onClick={()=>window.open(makeWhatsappUrl(data), '_blank')}>
            <WhatsappIcon size={15}/> Confirmar asistencia
          </button>
          <button className="public-action" onClick={()=>window.open(makeMapsUrl(data), '_blank')}>
            <FineIcon type="pin" size={14}/> Ver ubicación
          </button>
          <button className="public-action" onClick={()=>window.open(makeCalendarUrl(data), '_blank')}>
            <FineIcon type="calendar" size={14}/> Agendar
          </button>
          <button className="public-action" onClick={()=>setMusicOn(v=>!v)}>
            <FineIcon type="music" size={14}/> {musicOn ? 'Música on' : 'Música off'}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useTweaks({ showAdmin:false, snapScroll:true, stagePalette:'dark' });
  const [collection, setCollection] = useState('floral');
  const [demoPalette, setDemoPalette] = useState(getStylePalettes(STYLE_BY_ID.floral)[0]);
  const [selectedPalettes, setSelectedPalettes] = useState({ floral: getStylePalettes(STYLE_BY_ID.floral)[0] });
  const [liveFields, setLiveFields] = useState({ baby: '', date: '', time: '', place: '', address: '', whatsapp: '' });
  const [activeIdx, setActiveIdx] = useState(0);
  const scrollRef = useRef(null);

  useEffect(()=>{
    const el = scrollRef.current; if (!el) return;
    const fn = ()=>{
      const center = el.scrollTop + el.clientHeight * 0.45;
      const children = Array.from(el.children);
      const i = children.reduce((best, child, index) => {
        const dist = Math.abs(child.offsetTop - center);
        return dist < best.dist ? { index, dist } : best;
      }, { index:0, dist:Infinity }).index;
      setActiveIdx(Math.max(0, Math.min(SCENES_META.length-1, i)));
    };
    el.addEventListener('scroll', fn, { passive:true }); fn();
    return ()=>el.removeEventListener('scroll', fn);
  }, []);

  const goTo = (i) => {
    const el = scrollRef.current; if (!el) return;
    const target = el.children[i];
    el.scrollTo({ top: target ? target.offsetTop : i * el.clientHeight, behavior:'smooth' });
  };

  const chooseCollection = (styleId, palette) => {
    const style = STYLE_BY_ID[styleId] || STYLE_BY_ID.floral;
    const chosenPalette = palette || selectedPalettes[style.id] || getStylePalettes(style)[0];
    setCollection(style.id);
    setDemoPalette(chosenPalette);
    setSelectedPalettes(current => ({ ...current, [style.id]: chosenPalette }));
  };

  const orderStyle = (styleId, palette) => {
    const style = STYLE_BY_ID[styleId] || STYLE_BY_ID.floral;
    const data = getLiveInviteData(style.id, liveFields);
    const hasTypedData = Object.values(liveFields).some(value => String(value || '').trim());
    const paletteText = palette ? ` paleta ${palette.name}` : '';
    const details = hasTypedData
      ? ` Datos: ${data.baby} · ${data.date} · ${data.time} · ${data.place}.`
      : '';
    window.open(`https://wa.me/?text=${encodeURIComponent(`Hola, quiero una invitación digital estilo ${style.name}${paletteText}.${details}`)}`, '_blank');
  };

  return (
    <div className="boutique-stage" style={{ background: STAGE_BG[tweaks.stagePalette] }}>

      {/* Desktop left panel */}
      <StageLeft activeScene={SCENES_META[activeIdx].id} goTo={goTo}/>

      {/* Mobile chrome */}
      <div className="brand-mark">
        <div className="b1">Baby Invites</div>
        <div className="b2">Boutique · Vol. 01</div>
      </div>
      <div className="reel-meta">
        <div className="num">{String(activeIdx+1).padStart(2,'0')}</div>
        <div>{SCENES_META[activeIdx].name}</div>
        <div style={{ opacity:0.45 }}>de {SCENES_META.length}</div>
      </div>
      <div className="outside-controls">
        {SCENES_META.map((s,i)=>(
          <button key={s.id} className={`scene-jumper ${i===activeIdx?'active':''}`} onClick={()=>goTo(i)} title={s.name}>{i+1}</button>
        ))}
      </div>

      {/* Main experience */}
      <div className="phone">
        <div className="statusbar">
          <span>9:41</span>
          <div className="right">
            <span style={{ fontSize:10 }}>●●●●●</span>
            <span style={{ marginLeft:3 }}>5G</span>
            <svg viewBox="0 0 24 12" width="18" height="9" style={{ marginLeft:2 }}>
              <rect x="0.5" y="1" width="19" height="10" rx="2" fill="none" stroke="currentColor" strokeWidth="1"/>
              <rect x="2" y="2.5" width="14" height="7" rx="1" fill="currentColor"/>
              <rect x="20" y="4" width="2" height="4" fill="currentColor"/>
            </svg>
          </div>
        </div>

        <div ref={scrollRef} className="phone-scroll" style={{ scrollSnapType: tweaks.snapScroll ? 'y mandatory' : 'none' }}>
          <SceneHero onJump={()=>goTo(3)}/>
          <SceneDemo collection={collection} setCollection={chooseCollection} liveFields={liveFields} setLiveFields={setLiveFields} selectedPalette={demoPalette} onViewStyles={()=>goTo(3)}/>
          <SceneHowWorks/>
          <SceneCollectionIntro onTryDemo={(c,palette)=>{chooseCollection(c, palette);goTo(1);}} onOrderStyle={orderStyle}/>
          <SceneCompare/>
          <SceneIncludes/>
          <ScenePrice/>
          <SceneCTA/>
        </div>

        {tweaks.showAdmin && (
          <div style={{ position:'absolute', bottom:14, left:'50%', transform:'translateX(-50%)', background:'rgba(20,14,10,0.9)', color:'#f5e9d8', padding:'6px 14px', borderRadius:100, fontSize:8, letterSpacing:'0.2em', textTransform:'uppercase', zIndex:60 }}>
            ⚙ admin · personalizar datos
          </div>
        )}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Stage">
          <TweakSelect label="Backdrop" value={tweaks.stagePalette} onChange={v=>setTweaks({stagePalette:v})}
            options={[{value:'dark',label:'Editorial dark'},{value:'cream',label:'Warm cream'},{value:'blush',label:'Blush rose'}]}/>
          <TweakToggle label="Snap scroll"  value={tweaks.snapScroll}  onChange={v=>setTweaks({snapScroll:v})}/>
        </TweakSection>
        <TweakSection label="Demo">
          <TweakRadio label="Colección" value={collection} onChange={chooseCollection}
            options={INVITATION_STYLES.map(style => ({ value:style.id, label:style.shortName.slice(0, 3) }))}/>
        </TweakSection>
        <TweakSection label="Internal">
          <TweakToggle label="Admin badge" value={tweaks.showAdmin} onChange={v=>setTweaks({showAdmin:v})}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

function Root() {
  const isPublicInvitation = window.location.pathname.replace(/\/+$/, '') === '/invitacion';
  return isPublicInvitation ? <PublicInvitationPage/> : <App/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
</script>
</body>
</html>
