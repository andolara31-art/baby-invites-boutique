<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Baby Invites Boutique — Editorial</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Outfit:wght@200;300;400;500;600&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Outfit', system-ui, sans-serif;
  background: #1a1410;
  color: #2a201a;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
  height: 100%; width: 100%;
}
#root { width: 100%; height: 100%; }

/* ── Stage ── */
.boutique-stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.boutique-stage::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(212,165,116,0.06) 0%, transparent 1px),
    radial-gradient(circle at 60% 70%, rgba(212,165,116,0.04) 0%, transparent 1px),
    radial-gradient(circle at 80% 20%, rgba(212,165,116,0.05) 0%, transparent 1px);
  background-size: 5px 5px, 9px 9px, 13px 13px;
  pointer-events: none; opacity: 0.7; z-index: 0;
}

/* ── Desktop 2-column ── */
@media (min-width: 900px) {
  .boutique-stage {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0;
    align-items: center;
    justify-items: center;
  }
  .stage-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 40px 48px 72px;
    max-width: 500px;
    width: 100%;
    z-index: 10;
  }
  .brand-mark, .reel-meta, .outside-controls { display: none !important; }
  .phone { margin-right: 48px; }
}
@media (max-width: 899px) {
  .stage-left { display: none !important; }
}

/* ── Desktop left panel ── */
.stage-left { display: none; }
.stage-left-eyebrow {
  font-family: 'Outfit', sans-serif;
  font-size: 10px; letter-spacing: 0.36em;
  text-transform: uppercase; font-weight: 500;
  color: rgba(245,233,216,0.5); margin-bottom: 16px;
}
.stage-left-brand {
  font-family: 'DM Serif Display', serif;
  font-size: 22px; color: #f5e9d8; line-height: 1; margin-bottom: 4px;
}
.stage-left-sub {
  font-family: 'Outfit', sans-serif;
  font-size: 9px; letter-spacing: 0.36em;
  text-transform: uppercase; opacity: 0.45; color: #f5e9d8; margin-bottom: 32px;
}
.stage-left-headline {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(28px, 3vw, 40px);
  color: #f5e9d8; line-height: 1.05;
  letter-spacing: -0.02em; margin-bottom: 12px;
}
.stage-left-desc {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 17px;
  color: rgba(245,233,216,0.75); line-height: 1.5;
  margin-bottom: 32px;
}
.stage-left-divider {
  width: 40px; height: 1px;
  background: rgba(212,165,116,0.4); margin-bottom: 24px;
}
.stage-left-scenes {
  display: flex; flex-direction: column; gap: 8px;
}
.stage-left-scene-btn {
  background: none; border: none; cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(245,233,216,0.4); text-align: left;
  padding: 4px 0; transition: color 0.2s ease;
}
.stage-left-scene-btn.active { color: #d4a574; }
.stage-left-scene-btn:hover { color: rgba(245,233,216,0.7); }

/* ── Phone ── */
.phone {
  position: relative;
  width: 390px;
  height: min(844px, 94vh);
  background: #fff;
  border-radius: 54px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.8) inset,
    0 40px 100px -20px rgba(0,0,0,0.65),
    0 80px 140px -40px rgba(0,0,0,0.5),
    0 0 0 11px #0a0604,
    0 0 0 12px rgba(255,255,255,0.04);
  overflow: hidden;
  z-index: 2;
  flex-shrink: 0;
}
.phone-notch {
  position: absolute; top: 12px; left: 50%;
  transform: translateX(-50%);
  width: 118px; height: 34px;
  background: #0a0604; border-radius: 22px; z-index: 50;
  pointer-events: none;
}
.phone-scroll {
  width: 100%; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
.phone-scroll::-webkit-scrollbar { display: none; }

/* ── Scenes ── */
.scene {
  width: 100%;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.scene-snap {
  height: 100%;
  flex-shrink: 0;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
}

/* Safe zone — below notch */
.safe-top { padding-top: 60px; }

/* ── Status bar ── */
.statusbar {
  position: absolute; top: 16px; left: 0; right: 0;
  display: flex; justify-content: space-between;
  padding: 10px 32px 0;
  font-size: 13px; font-weight: 600;
  z-index: 40; font-feature-settings: "tnum";
  mix-blend-mode: difference; color: #faf3e7;
  pointer-events: none;
}
.statusbar .right { display: flex; gap: 5px; align-items: center; }

/* ── Type ── */
.eyebrow {
  font-family: 'Outfit', sans-serif;
  font-size: 10px; letter-spacing: 0.32em;
  text-transform: uppercase; font-weight: 500;
}
.display { font-family: 'DM Serif Display', serif; font-weight: 400; letter-spacing: -0.02em; line-height: 1.0; }
.script  { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }

/* ── Animations ── */
@keyframes float-1 { 0%,100%{transform:translate(0,0) rotate(-9deg);} 50%{transform:translate(2px,-10px) rotate(-7deg);} }
@keyframes float-2 { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-12px) rotate(1deg);} }
@keyframes float-3 { 0%,100%{transform:translate(0,0) rotate(10deg);} 50%{transform:translate(3px,-10px) rotate(8deg);} }
@keyframes drift   { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-7px);} }
@keyframes drift-slow { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
@keyframes fall {
  0%  { transform:translateY(-20px) rotate(0); opacity:0; }
  8%, 90% { opacity:1; }
  100%{ transform:translateY(120vh) rotate(360deg); opacity:0; }
}
@keyframes wave { 0%,100%{height:3px;} 50%{height:12px;} }
@keyframes pulse-down { 0%,100%{transform:translateX(-50%) translateY(0);opacity:0.4;} 50%{transform:translateX(-50%) translateY(5px);opacity:0.8;} }

/* ── Invite mocks ── */
.invite-mock {
  position: relative; border-radius: 18px; overflow: hidden;
  box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 14px 36px -10px rgba(0,0,0,0.3), 0 32px 64px -20px rgba(0,0,0,0.2);
  aspect-ratio: 9/16; width: 100%;
}
.invite-honey  { background: radial-gradient(ellipse at 50% 30%, #fff4dd 0%, #f5e1bd 60%, #e8c989 100%); }
.invite-floral { background: radial-gradient(ellipse at 50% 70%, #fde4e0 0%, #f5cfc9 50%, #e8b4b0 100%); }
.invite-minimal{ background: linear-gradient(180deg, #faf5ec 0%, #f0e6d4 100%); }
.watercolor { position:absolute; border-radius:50%; filter:blur(18px); opacity:0.42; pointer-events:none; }
.wave-bar { width:2px; background:currentColor; border-radius:2px; animation:wave 0.9s ease-in-out infinite; }

/* ── Buttons ── */
.btn-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 15px 22px; border-radius: 100px;
  font-family: 'Outfit', sans-serif; font-weight: 500;
  font-size: 12px; letter-spacing: 0.06em;
  border: none; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; text-transform: uppercase;
}
.btn-pill:active { transform: scale(0.97); }
.btn-dark      { background: #1a1410; color: #f5e9d8; }
.btn-light     { background: #f5e9d8; color: #1a1410; border: 1px solid rgba(0,0,0,0.06); }
.btn-whatsapp  { background: #25D366; color: #fff; box-shadow: 0 10px 28px -6px rgba(37,211,102,0.5); }

/* ── Backgrounds ── */
.bg-honey-deep {
  background: radial-gradient(ellipse at 30% 25%, #fff4dd 0%, transparent 50%),
              radial-gradient(ellipse at 80% 90%, #d4a574 0%, transparent 50%),
              linear-gradient(180deg, #f5e1bd 0%, #d4a574 100%);
}
.bg-floral-deep {
  background: radial-gradient(ellipse at 70% 20%, #fff0eb 0%, transparent 55%),
              radial-gradient(ellipse at 20% 90%, #c87a76 0%, transparent 55%),
              linear-gradient(180deg, #fde4e0 0%, #e8b4b0 100%);
}
.bg-minimal-deep {
  background: radial-gradient(ellipse at 50% 30%, #faf6f0 0%, transparent 55%),
              radial-gradient(ellipse at 80% 100%, #c9a876 0%, transparent 50%),
              linear-gradient(180deg, #f0e6d4 0%, #c9a876 100%);
}
.bg-paper { background: radial-gradient(ellipse at 50% 0%, #fdf6e8 0%, #ead8c4 100%); }
.bg-night { background: radial-gradient(ellipse at 50% 30%, #2a1f18 0%, #0e0a08 100%); color: #f5e9d8; }

/* ── Demo phone-in-phone ── */
.demo-frame {
  border-radius: 32px; background: #0a0604; padding: 8px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 20px 44px -10px rgba(0,0,0,0.55);
}
.demo-screen { width: 100%; height: 100%; border-radius: 25px; overflow: hidden; position: relative; }

/* ── Compare ── */
.compare-track {
  position: relative; width: 100%; border-radius: 18px; overflow: hidden;
  box-shadow: 0 8px 24px -8px rgba(0,0,0,0.2);
  user-select: none;
}
.compare-side { position: absolute; inset: 0; }
.compare-handle {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.12); cursor: ew-resize; z-index: 10;
  display: flex; align-items: center; justify-content: center;
}
.compare-knob {
  width: 36px; height: 36px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #2a201a; flex-shrink: 0;
}

/* ── Outside controls ── */
.outside-controls {
  position: fixed; left: 20px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 5px; z-index: 100;
}
.scene-jumper {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(245,233,216,0.07); backdrop-filter: blur(8px);
  border: 1px solid rgba(245,233,216,0.1);
  font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 500;
  color: rgba(245,233,216,0.45); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.scene-jumper:hover { background: rgba(245,233,216,0.16); color: #f5e9d8; }
.scene-jumper.active { background: #f5e9d8; color: #1a1410; width: 36px; height: 36px; }
.brand-mark { position: fixed; top: 24px; left: 24px; z-index: 100; color: #f5e9d8; }
.brand-mark .b1 { font-family: 'DM Serif Display', serif; font-size: 17px; line-height: 1; }
.brand-mark .b2 { font-family: 'Outfit', sans-serif; font-size: 8px; letter-spacing: 0.36em; text-transform: uppercase; opacity: 0.5; }
.reel-meta {
  position: fixed; top: 24px; right: 24px; z-index: 100;
  font-family: 'Outfit', sans-serif; font-size: 8px; letter-spacing: 0.3em;
  text-transform: uppercase; text-align: right; line-height: 1.8;
  color: rgba(245,233,216,0.5);
}
.reel-meta .num { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.02em; color: #f5e9d8; margin-bottom: 3px; font-style: italic; }

/* ── Scroll hint ── */
.scroll-hint {
  position: absolute; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  font-family: 'Outfit', sans-serif; font-weight: 500;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  animation: pulse-down 2s ease-in-out infinite; z-index: 10;
}

/* ── Tweaks panel ── */
.twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:272px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:rgba(250,249,247,.8);color:#29261b;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:.5px solid rgba(255,255,255,.6);border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
.twk-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 14px;cursor:move;user-select:none}
.twk-hd b{font-size:12px;font-weight:600}
.twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
.twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
.twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
.twk-row{display:flex;flex-direction:column;gap:5px}
.twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
.twk-lbl>span:first-child{font-weight:500}
.twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(41,38,27,.45);padding:10px 0 0}
.twk-sect:first-child{padding-top:0}
.twk-field{appearance:none;width:100%;height:26px;padding:0 8px;border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
select.twk-field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");background-repeat:no-repeat;background-position:right 8px center;padding-right:22px}
.twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
.twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
.twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;background:transparent;color:inherit;font:inherit;font-weight:500;height:22px;border-radius:6px;cursor:default;padding:0}
.twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
.twk-toggle[data-on="1"]{background:#34c759}
.twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.twk-toggle[data-on="1"] i{transform:translateX(14px)}

/* ── Mobile full-screen phone ── */
@media (max-width: 460px) {
  .phone { width: 100vw; height: 100svh; border-radius: 0; box-shadow: none; margin: 0; }
  .phone-notch { display: none; }
  .safe-top { padding-top: 48px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ═══════════════════════════════════════════════════════════════
   TWEAKS PANEL
═══════════════════════════════════════════════════════════════ */
function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrObj, val) => {
    setValues(prev => typeof keyOrObj === 'object' ? { ...prev, ...keyOrObj } : { ...prev, [keyOrObj]: val });
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = useState(false);
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clamp = useCallback(() => {
    const p = dragRef.current; if (!p) return;
    const mR = Math.max(PAD, window.innerWidth - p.offsetWidth - PAD);
    const mB = Math.max(PAD, window.innerHeight - p.offsetHeight - PAD);
    offsetRef.current = { x: Math.min(mR, Math.max(PAD, offsetRef.current.x)), y: Math.min(mB, Math.max(PAD, offsetRef.current.y)) };
    p.style.right = offsetRef.current.x + 'px'; p.style.bottom = offsetRef.current.y + 'px';
  }, []);
  useEffect(() => {
    if (!open) return;
    clamp();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clamp) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clamp); return () => window.removeEventListener('resize', clamp);
  }, [open, clamp]);
  useEffect(() => {
    const h = (e) => { const t = e?.data?.type; if (t === '__activate_edit_mode') setOpen(true); else if (t === '__deactivate_edit_mode') setOpen(false); };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);
  const onDragStart = (e) => {
    const p = dragRef.current; if (!p) return;
    const r = p.getBoundingClientRect();
    const sR = window.innerWidth - r.right, sB = window.innerHeight - r.bottom, sx = e.clientX, sy = e.clientY;
    const mv = (ev) => { offsetRef.current = { x: sR - (ev.clientX - sx), y: sB - (ev.clientY - sy) }; clamp(); };
    const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
      <div className="twk-hd" onMouseDown={onDragStart}><b>{title}</b><button className="twk-x" onMouseDown={e => e.stopPropagation()} onClick={() => setOpen(false)}>✕</button></div>
      <div className="twk-body">{children}</div>
    </div>
  );
}
function TweakSection({ label, children }) { return (<><div className="twk-sect">{label}</div>{children}</>); }
function TweakToggle({ label, value, onChange }) {
  return (<div className="twk-row twk-row-h"><div className="twk-lbl"><span>{label}</span></div><button type="button" className="twk-toggle" data-on={value?'1':'0'} onClick={() => onChange(!value)}><i/></button></div>);
}
function TweakRadio({ label, value, options, onChange }) {
  const ref = useRef(null);
  const [drag, setDrag] = useState(false);
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  const vRef = useRef(value); vRef.current = value;
  const segAt = (cx) => { const r = ref.current.getBoundingClientRect(); const i = Math.floor(((cx - r.left - 2) / (r.width - 4)) * n); return opts[Math.max(0, Math.min(n-1, i))].value; };
  const onDown = (e) => {
    setDrag(true); const v0 = segAt(e.clientX); if (v0 !== vRef.current) onChange(v0);
    const mv = (ev) => { const v = segAt(ev.clientX); if (v !== vRef.current) onChange(v); };
    const up = () => { setDrag(false); window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  };
  return (<div className="twk-row"><div className="twk-lbl"><span>{label}</span></div><div ref={ref} role="radiogroup" onPointerDown={onDown} className={drag?'twk-seg dragging':'twk-seg'}><div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx} * (100% - 4px) / ${n})`, width:`calc((100% - 4px) / ${n})` }}/>{opts.map(o => <button key={o.value} type="button">{o.label}</button>)}</div></div>);
}
function TweakSelect({ label, value, options, onChange }) {
  return (<div className="twk-row"><div className="twk-lbl"><span>{label}</span></div><select className="twk-field" value={value} onChange={e => onChange(e.target.value)}>{options.map(o => { const v = typeof o === 'object' ? o.value : o; const l = typeof o === 'object' ? o.label : o; return <option key={v} value={v}>{l}</option>; })}</select></div>);
}

/* ── 08 ANTES / DESPUÉS ── */
function SceneCompare() {
  const [pos, setPos] = useState(50);
  const trackRef = useRef(null);
  const dragging = useRef(false);
  const onMove = (cx) => {
    if (!trackRef.current) return;
    const r = trackRef.current.getBoundingClientRect();
    setPos(Math.max(6, Math.min(94, ((cx - r.left) / r.width) * 100)));
  };
  return (
    <div className="scene scene-snap bg-night">
      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'68px 28px 36px', gap:14, overflow:'hidden' }}>
        {/* Header */}
        <div style={{ flexShrink:0 }}>
          <div className="eyebrow" style={{ color:'#d4a574', marginBottom:6 }}>08 · Antes / Después</div>
          <div className="display" style={{ fontSize:'clamp(22px,6.5vw,28px)', color:'#f5e9d8', lineHeight:0.95, letterSpacing:'-0.02em' }}>De una imagen plana</div>
          <div style={{ fontFamily:'DM Serif Display', fontStyle:'italic', fontSize:'clamp(26px,8vw,34px)', color:'#d4a574', lineHeight:0.95, letterSpacing:'-0.02em', marginTop:-2 }}>a un momento.</div>
        </div>

        {/* Labels row */}
        <div style={{ display:'flex', justifyContent:'space-between', flexShrink:0 }}>
          <div style={{ fontSize:9, letterSpacing:'0.3em', textTransform:'uppercase', color:'rgba(245,233,216,0.45)', fontWeight:600 }}>← ANTES</div>
          <div style={{ fontSize:9, letterSpacing:'0.3em', textTransform:'uppercase', color:'#d4a574', fontWeight:600 }}>DESPUÉS →</div>
        </div>

        {/* Compare track */}
        <div ref={trackRef} className="compare-track" style={{ flex:1, minHeight:0, maxHeight:380, cursor:'ew-resize' }}
          onMouseDown={()=>{ dragging.current=true; }}
          onMouseMove={e=>{ if(dragging.current) onMove(e.clientX); }}
          onMouseUp={()=>{ dragging.current=false; }}
          onMouseLeave={()=>{ dragging.current=false; }}
          onTouchStart={()=>{ dragging.current=true; }}
          onTouchMove={e=>onMove(e.touches[0].clientX)}
          onTouchEnd={()=>{ dragging.current=false; }}>

          {/* DESPUÉS (full, behind) */}
          <div className="compare-side" style={{ background:'linear-gradient(180deg,#fdf4f1 0%,#f5dcd5 100%)', display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}>

}

/* ═══════════════════════════════════════════════════════════════
   DESKTOP LEFT PANEL
═══════════════════════════════════════════════════════════════ */
const SCENE_COPY = {
  hero:      { headline:'Invitaciones digitales\nque se sienten\ncomo un recuerdo.',   sub:'Boutique de invitaciones para baby shower — animadas, editables y listas para compartir por WhatsApp.' },
  intro:     { headline:'Tres colecciones,\nuna sola emoción.',                         sub:'Cada diseño tiene su propio lenguaje visual. Honey & Cream, Floral Blush o Minimal Chic.' },

  'c-floral':{ headline:'Jardín de Amor —\nFloral Blush.',                              sub:'Peonías acuarela, pétalos cayendo, detalles champagne. Editorial, romántico, femenino.' },

  cta:       { headline:'Lista en 24 horas.\nPersonalizada para ti.',                   sub:'Solo necesitamos los datos del bebé, la fecha y el lugar. Nosotros hacemos el resto.' },
};

function StageLeft({ activeScene, goTo }) {
  const scenes = [
    { id:'hero', name:'Hero' },{ id:'intro', name:'Colección' },{ id:'c-honey', name:'Dulce Espera' },
    { id:'c-floral', name:'Jardín de Amor' },{ id:'c-minimal', name:'Pequeño Milagro' },
    { id:'demo', name:'Demo' },{ id:'includes', name:'Qué incluye' },
    { id:'compare', name:'Antes / Después' },{ id:'viral', name:'Reel' },{ id:'cta', name:'Pídela' },
  ];
  const copy = SCENE_COPY[activeScene] || SCENE_COPY.hero;
  return (
    <div className="stage-left">
      <div>
        <div className="stage-left-brand">Baby Invites</div>
        <div className="stage-left-sub">Boutique · Vol. 01</div>

/* ═══════════════════════════════════════════════════════════════
   APP
═══════════════════════════════════════════════════════════════ */
const STAGE_BG = {
  dark:  'radial-gradient(ellipse at 25% 20%, #3a2820 0%, transparent 55%), radial-gradient(ellipse at 80% 75%, #2a1f18 0%, transparent 50%), linear-gradient(180deg, #1a1410 0%, #221814 100%)',
  cream: 'radial-gradient(ellipse at 30% 20%, #f5e9d8 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #ead8c4 0%, transparent 50%), linear-gradient(180deg, #efe4d2 0%, #e6d5be 100%)',
  blush: 'radial-gradient(ellipse at 30% 20%, #fde4e0 0%, transparent 55%), radial-gradient(ellipse at 70% 80%, #f5cfc9 0%, transparent 50%), linear-gradient(180deg, #fbe7e2 0%, #e8b4b0 100%)',
};
const SCENES_META = [
  {id:'hero',name:'Hero'},{id:'intro',name:'Colección'},{id:'c-honey',name:'Dulce Espera'},
  {id:'c-floral',name:'Jardín de Amor'},{id:'c-minimal',name:'Pequeño Milagro'},
  {id:'demo',name:'Demo'},{id:'includes',name:'Qué incluye'},
  {id:'compare',name:'Antes / Después'},{id:'viral',name:'Reel'},{id:'cta',name:'Pídela'},
];

function App() {
  const [tweaks, setTweaks] = useTweaks({ showAdmin:false, phoneFrame:true, snapScroll:true, stagePalette:'dark' });
  const [collection, setCollection] = useState('floral');
  const [activeIdx, setActiveIdx] = useState(0);
  const scrollRef = useRef(null);

  useEffect(()=>{
    const el = scrollRef.current; if (!el) return;
    const fn = ()=>{ const i = Math.round(el.scrollTop / el.clientHeight); setActiveIdx(Math.max(0, Math.min(SCENES_META.length-1, i))); };
    el.addEventListener('scroll', fn, { passive:true }); fn();
    return ()=>el.removeEventListener('scroll', fn);
  }, []);

  const goTo = (i) => {
    const el = scrollRef.current; if (!el) return;
    el.scrollTo({ top: i * el.clientHeight, behavior:'smooth' });
  };

  return (
    <div className="boutique-stage" style={{ background: STAGE_BG[tweaks.stagePalette] }}>

      {/* Desktop left panel */}
      <StageLeft activeScene={SCENES_META[activeIdx].id} goTo={goTo}/>

      {/* Mobile chrome */}
      <div className="brand-mark">
        <div className="b1">Baby Invites</div>
        <div className="b2">Boutique · Vol. 01</div>
      </div>
      <div className="reel-meta">
        <div className="num">{String(activeIdx+1).padStart(2,'0')}</div>
        <div>{SCENES_META[activeIdx].name}</div>
        <div style={{ opacity:0.45 }}>de {SCENES_META.length}</div>
      </div>
      <div className="outside-controls">
        {SCENES_META.map((s,i)=>(
          <button key={s.id} className={`scene-jumper ${i===activeIdx?'active':''}`} onClick={()=>goTo(i)} title={s.name}>{i+1}</button>
        ))}
      </div>

      {/* Phone */}
      <div className="phone" style={tweaks.phoneFrame ? {} : { borderRadius:24, boxShadow:'0 40px 80px -20px rgba(0,0,0,0.5)' }}>
        {tweaks.phoneFrame && <div className="phone-notch"/>}

        <div className="statusbar">
          <span>9:41</span>
          <div className="right">
            <span style={{ fontSize:10 }}>●●●●●</span>
            <span style={{ marginLeft:3 }}>5G</span>
            <svg viewBox="0 0 24 12" width="18" height="9" style={{ marginLeft:2 }}>
              <rect x="0.5" y="1" width="19" height="10" rx="2" fill="none" stroke="currentColor" strokeWidth="1"/>
              <rect x="2" y="2.5" width="14" height="7" rx="1" fill="currentColor"/>
              <rect x="20" y="4" width="2" height="4" fill="currentColor"/>
            </svg>
          </div>
        </div>

        <div ref={scrollRef} className="phone-scroll" style={{ scrollSnapType: tweaks.snapScroll ? 'y mandatory' : 'none' }}>
          <SceneHero onJump={()=>goTo(1)}/>
          <SceneCollectionIntro onContinue={()=>goTo(2)}/>
          <SceneCollectionPage which="honey"   onTryDemo={c=>{setCollection(c);goTo(5);}}/>
          <SceneCollectionPage which="floral"  onTryDemo={c=>{setCollection(c);goTo(5);}}/>
          <SceneCollectionPage which="minimal" onTryDemo={c=>{setCollection(c);goTo(5);}}/>
          <SceneDemo collection={collection} setCollection={setCollection}/>
          <SceneIncludes/>
          <SceneCompare/>
          <SceneViral/>
          <SceneCTA/>
        </div>

        {tweaks.showAdmin && (
          <div style={{ position:'absolute', bottom:14, left:'50%', transform:'translateX(-50%)', background:'rgba(20,14,10,0.9)', color:'#f5e9d8', padding:'6px 14px', borderRadius:100, fontSize:8, letterSpacing:'0.2em', textTransform:'uppercase', zIndex:60 }}>
            ⚙ admin · personalizar datos
          </div>
        )}
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Stage">
          <TweakSelect label="Backdrop" value={tweaks.stagePalette} onChange={v=>setTweaks({stagePalette:v})}
            options={[{value:'dark',label:'Editorial dark'},{value:'cream',label:'Warm cream'},{value:'blush',label:'Blush rose'}]}/>
          <TweakToggle label="Phone frame"  value={tweaks.phoneFrame}  onChange={v=>setTweaks({phoneFrame:v})}/>
          <TweakToggle label="Snap scroll"  value={tweaks.snapScroll}  onChange={v=>setTweaks({snapScroll:v})}/>
        </TweakSection>
        <TweakSection label="Demo">
          <TweakRadio label="Colección" value={collection} onChange={setCollection}
            options={[{value:'honey',label:'🍯'},{value:'floral',label:'🌸'},{value:'minimal',label:'🤍'}]}/>
        </TweakSection>
        <TweakSection label="Internal">
          <TweakToggle label="Admin badge" value={tweaks.showAdmin} onChange={v=>setTweaks({showAdmin:v})}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
